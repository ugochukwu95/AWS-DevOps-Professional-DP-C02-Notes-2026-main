apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    {{- include "taskq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        {{- include "taskq.labels" . | nindent 8 }}
      annotations:
        # envFrom doesn't pick up ConfigMap changes on its own; this hash forces a rollout.
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: worker
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "taskq.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker
      containers:
        - name: worker
          image: {{ include "taskq.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/worker"]
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: taskq-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskq.dbSecretName" . }}
                  key: DATABASE_URL
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            {{- include "taskq.containerSecurityContext" . | nindent 12 }}
