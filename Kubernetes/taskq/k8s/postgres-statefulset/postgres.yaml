# Week 6 (note 08): Postgres inside the cluster. Before applying, delete the
# external Service and EndpointSlice:
#   kubectl -n taskq delete service postgres
#   kubectl -n taskq delete endpointslice postgres-external
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: taskq
type: Opaque
stringData:
  POSTGRES_USER: taskq
  POSTGRES_PASSWORD: taskq
  POSTGRES_DB: taskq
---
# Headless: DNS returns the pod IP directly and gives the pod a stable name
# (postgres-0.postgres.taskq.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskq
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: taskq
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: taskq
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: taskq
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: taskq
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        # uid/gid of the postgres user in the official Debian-based image.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # A subdirectory, because a fresh filesystem root contains lost+found
            # and initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "taskq", "-d", "taskq"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "taskq", "-d", "taskq"]
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Omitted storageClassName = the cluster default (kind: "standard", EKS: set gp3 as default).
        resources:
          requests:
            storage: 1Gi
