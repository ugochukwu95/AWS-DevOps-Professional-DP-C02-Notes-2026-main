# Default StorageClass for EKS (note 14). Requires the aws-ebs-csi-driver add-on.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
# Create the volume in the AZ where the pod is scheduled.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
