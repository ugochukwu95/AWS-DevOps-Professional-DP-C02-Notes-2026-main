apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: taskq
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: taskq
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: taskq
    spec:
      serviceAccountName: worker
      # The worker finishes its current job after SIGTERM; this caps how long that may take.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker
      containers:
        - name: worker
          image: taskq:dev
          command: ["/worker"]
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: taskq-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskq-db
                  key: DATABASE_URL
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          # No readiness probe: nothing routes traffic to the worker.
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
