# Note 20: least-privilege network access for taskq. Requires PG_MODE=cluster
# (podSelector rules can't match the Postgres container outside the cluster)
# and a CNI that enforces NetworkPolicy.
#
# 1. Deny everything in and out of the namespace by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: taskq
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2. Every pod may resolve names through CoreDNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: taskq
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 3. The api accepts HTTP from anywhere and may only talk to Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: taskq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - { protocol: TCP, port: 5432 }
---
# 4. The worker accepts nothing except metrics scrapes, and talks to Postgres and HTTPS (S3 on EKS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  namespace: taskq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: worker
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - { protocol: TCP, port: 8081 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - { protocol: TCP, port: 5432 }
    - ports:
        - { protocol: TCP, port: 443 }
---
# 5. Postgres accepts connections only from the api and the worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: taskq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: ["api", "worker"] }
      ports:
        - { protocol: TCP, port: 5432 }
